# Lets the Flink Pods present their own Azure identity (Workload Identity)
# instead of the shared-key credentials 01_catalog.sql used to carry.
#
# ${FLINK_WORKLOAD_IDENTITY_CLIENT_ID} is filled in at deploy time
# (envsubst) from `terraform output flink_workload_identity_client_id`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink
  namespace: flink
  annotations:
    azure.workload.identity/client-id: "${FLINK_WORKLOAD_IDENTITY_CLIENT_ID}"
