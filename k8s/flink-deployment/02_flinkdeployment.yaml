# FlinkDeployment is a CRD added by the Flink Kubernetes Operator, not a
# built-in Kubernetes kind -- applying this only works after
# k8s/flink-operator/install.sh has run.
#
# spec.job.jarURI must point to an executable JAR: raw .sql files can't be
# submitted directly. This uses the "SQL runner" pattern from Apache
# Flink's own flink-kubernetes-operator examples (examples/flink-sql-runner-
# example) -- flink-jobs/sql-runner is our version of it. Build and push
# it first with flink-jobs/sql-runner/build-and-push.sh (which itself
# depends on an Azure Container Registry that doesn't exist in Terraform
# yet -- see that script's header comment).
#
# ${VAR} placeholders (ADLS_ACCOUNT_NAME, ADLS_ACCOUNT_KEY,
# FLINK_WORKLOAD_IDENTITY_CLIENT_ID) are filled in by 01_render-and-deploy.sh
# from 00_secrets.env, same as the SQL files -- this file is envsubst'd
# before being applied, never applied as-is.
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: inventory-monitor
  namespace: flink
spec:
  image: ${ACR_LOGIN_SERVER}/sql-runner:${SQL_RUNNER_TAG}
  flinkVersion: v1_20
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "2"
    # Checkpoints/HA metadata land in ADLS2 (via the flink-azure-fs-hadoop
    # plugin baked into the sql-runner image) instead of the JobManager
    # Pod's local disk. Still the storage account key here, NOT Workload
    # Identity: the plugin's bundled hadoop-azure driver is from 2022 and
    # doesn't have WorkloadIdentityTokenProvider (confirmed by inspecting
    # the actual jar -- it ships only MsiTokenProvider, which would mean
    # the AKS node's kubelet identity again, not this Pod's own). A newer
    # hadoop-azure (3.4.1+) has the class, but swapping just that jar risks
    # colliding with Flink's own glue classes bundled in the same plugin
    # jar. 01_catalog.sql's actual Iceberg reads/writes DO use Workload
    # Identity -- that goes through iceberg-azure-bundle's azure-identity
    # SDK, a completely different, newer codebase with no such limit. This
    # narrows the remaining key's blast radius to Flink's own internal
    # bookkeeping, not the business data.
    state.checkpoints.dir: "abfss://lakehouse@${ADLS_ACCOUNT_NAME}.dfs.core.windows.net/checkpoints"
    "fs.azure.account.key.${ADLS_ACCOUNT_NAME}.dfs.core.windows.net": "${ADLS_ACCOUNT_KEY}"
    # ABFS's default OutputStream buffering (fs.azure.data.blocks.buffer=disk)
    # stages blocks on local disk via Hadoop's "file://" FileSystem, which
    # isn't registered on this classpath (hadoop-client-api/-runtime only) --
    # checkpoints failed with "No FileSystem for scheme 'file'" every 30s,
    # which aborted the checkpoint and reset all job state each time.
    # bytebuffer keeps blocks in memory instead, sidestepping local disk I/O.
    fs.azure.data.blocks.buffer: "bytebuffer"
    execution.checkpointing.interval: "30s"
    # last-state needs Flink's own HA metadata (not just the checkpoint
    # files themselves) to know there's a prior execution to resume from
    # on redeploy -- without this, last-state silently behaves like
    # stateless. kubernetes-ha stores that metadata as ConfigMaps.
    high-availability.type: "kubernetes"
    high-availability.storageDir: "abfss://lakehouse@${ADLS_ACCOUNT_NAME}.dfs.core.windows.net/ha"
  serviceAccount: flink
  jobManager:
    resource:
      memory: "1024m"
      cpu: 0.5
  taskManager:
    resource:
      memory: "1024m"
      cpu: 0.5
  podTemplate:
    metadata:
      labels:
        # Required for the AKS Workload Identity mutating webhook to
        # inject the federated token env vars into these Pods.
        azure.workload.identity/use: "true"
    spec:
      containers:
        - name: flink-main-container
          volumeMounts:
            - name: sql-scripts
              mountPath: /opt/flink/sql
      volumes:
        - name: sql-scripts
          configMap:
            name: flink-sql
  job:
    jarURI: local:///opt/flink/usrlib/sql-runner.jar
    args: ["/opt/flink/sql"]
    parallelism: 2
    # last-state, not stateless: a redeploy (e.g. re-applying this file
    # after a config change) now resumes from the last checkpoint instead
    # of discarding the running aggregation and starting from zero.
    upgradeMode: last-state
