# Lets the Polaris Pod present its own Azure identity (Workload Identity)
# instead of falling back to the AKS node's kubelet identity, which is what
# happened by default when no credential was configured at all -- see
# README's "Polaris needs its own Azure IAM permissions" design note.
#
# ${POLARIS_WORKLOAD_IDENTITY_CLIENT_ID} is filled in at deploy time
# (envsubst) from `terraform output polaris_workload_identity_client_id`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: polaris
  namespace: flink
  annotations:
    azure.workload.identity/client-id: "${POLARIS_WORKLOAD_IDENTITY_CLIENT_ID}"
