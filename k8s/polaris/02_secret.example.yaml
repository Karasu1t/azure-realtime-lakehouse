# Copy to 02_secret.yaml (gitignored) and fill in real values before applying.
# Polaris needs a root principal credential to bootstrap its own admin API on
# first start -- this is Polaris's own auth, unrelated to the ADLS2/Polaris
# credentials used inside the Flink SQL files.
apiVersion: v1
kind: Secret
metadata:
  name: polaris-bootstrap
  namespace: flink
type: Opaque
stringData:
  # format: <realm>,<clientId>,<clientSecret>. The realm must match
  # polaris.realm-context.realms in 03_deployment.yaml (POLARIS); a mismatch
  # is silent -- the token endpoint just answers unauthorized_client.
  POLARIS_BOOTSTRAP_CREDENTIALS: "POLARIS,x.x.x.x,x.x.x.x"
