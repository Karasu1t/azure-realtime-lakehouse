# Copy to 01_secret.yaml (gitignored) and fill in real values before applying.
# Polaris needs a root principal credential to bootstrap its own admin API on
# first start -- this is Polaris's own auth, unrelated to the ADLS2/Polaris
# credentials used inside the Flink SQL files.
apiVersion: v1
kind: Secret
metadata:
  name: polaris-bootstrap
  namespace: flink
type: Opaque
stringData:
  # format: <realm>,<clientId>,<clientSecret> -- verify against the Polaris
  # version actually deployed, this env var name/format has changed before.
  POLARIS_BOOTSTRAP_CREDENTIALS: "default-realm,x.x.x.x,x.x.x.x"
