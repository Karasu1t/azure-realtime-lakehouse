# In-memory persistence: catalog metadata (namespaces, table pointers) is
# lost if this Pod restarts. Acceptable here because the whole cluster gets
# destroyed between verification sessions anyway -- a real DB backend would
# only survive a mid-session Pod crash, not a terraform destroy, so it
# wouldn't earn its cost for this project. See README ADR for the same
# reasoning applied to skipping Trino.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polaris
  namespace: flink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: polaris
  template:
    metadata:
      labels:
        app: polaris
        # Required for the AKS Workload Identity mutating webhook to inject
        # the federated token env vars into this Pod -- without this label,
        # serviceAccountName below has no effect and Azure Identity SDK's
        # DefaultAzureCredential falls back to the node's kubelet identity.
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: polaris
      containers:
        - name: polaris
          image: apache/polaris:1.7.0
          ports:
            - containerPort: 8181
              name: catalog-api
          env:
            - name: POLARIS_PERSISTENCE_TYPE
              value: in-memory
            - name: polaris.realm-context.realms
              value: POLARIS
          envFrom:
            - secretRef:
                name: polaris-bootstrap
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8182
            initialDelaySeconds: 15
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8182
            initialDelaySeconds: 20
